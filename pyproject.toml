[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devai"
version = "0.1.0"
description = "A Python AI library for developers and programmers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DevAI Contributors" }]
keywords = ["ai", "llm", "developer-tools", "code-assistant", "agents", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]

[project.scripts]
devai = "devai.cli:main"

[project.urls]
Homepage = "https://github.com/Kkkppmm/-agent-rebuild-everything-with-new-code-and-bug-fixes-and-69-4y"
Repository = "https://github.com/Kkkppmm/-agent-rebuild-everything-with-new-code-and-bug-fixes-and-69-4y"

[tool.hatch.build.targets.wheel]
packages = ["src/devai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
