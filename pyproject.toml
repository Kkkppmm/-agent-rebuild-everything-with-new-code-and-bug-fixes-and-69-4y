[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devai"
version = "0.1.0"
description = "A lightweight Python AI library for developers — chat, embeddings, tools, and RAG with a simple API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DevAI Contributors" }]
keywords = ["ai", "llm", "openai", "embeddings", "rag", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Kkkppmm/-agent-rebuild-everything-with-new-code-and-bug-fixes-and-69-4y"
Repository = "https://github.com/Kkkppmm/-agent-rebuild-everything-with-new-code-and-bug-fixes-and-69-4y"

[tool.hatch.build.targets.wheel]
packages = ["devai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
